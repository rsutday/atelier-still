<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ATELIER STILL</title>

<style>

body{
    margin:0;
    padding:0;
    background:#F7F2EA;
    color:#183B33;
    font-family:"Microsoft JhengHei",sans-serif;
    line-height:1.8;
}

.container{
    max-width:760px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

h1{
    font-size:56px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:40px;
}

button{
    cursor:pointer;
}

.primary-btn{
    padding:14px 28px;
    border:none;
    border-radius:999px;
    background:#183B33;
    color:white;
    font-size:16px;
}

#drawArea{
    display:none;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    width:120px;
    height:180px;

    background:#183B33;
    background:linear-gradient(
    180deg,
    #23493f 0%,
    #183B33 100%
);
    color:#F5E7B5;
    color:white;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;
    letter-spacing:2px;

    cursor:pointer;

    transition:0.3s;

box-shadow:0 8px 20px rgba(0,0,0,0.15);
border:1px solid rgba(255,255,255,0.15);
position:relative;
overflow:hidden;
}
    
.card:before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:rgba(255,255,255,.08);
    transform:skewX
    
.card:hover{
    transform:translateY(-10px) scale(1.03);
}

.result{
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:16px;
    text-align:left;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
}

.section-title{
    color:#999;
    font-size:14px;
    margin-top:25px;
}

.card-title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#183B33;
    margin-bottom:20px;
}

.guidance{
    line-height:1.8;
}

.question{
    background:#F5F5F5;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

.practice{
    background:#EEF5EF;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

</style>
</head>
<body>

<div class="container">

<h1>ATELIER STILL</h1>

<div
style="
width:80px;
height:80px;
border:2px solid #183B33;
border-radius:50%;
margin:0 auto 20px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
">
✦
</div>

<p style="
letter-spacing:3px;
font-size:12px;
color:#8A857C;
margin-bottom:10px;
">
A DAILY REFLECTION PRACTICE
</p>

<p class="subtitle">
在忙碌與答案之外，<br>
留一點空間給自己。
</p>

<button
class="primary-btn"
onclick="startDraw()">
開始抽牌
</button>

<div id="ritualArea" style="display:none;">

<h2>請先深呼吸一次</h2>

<p>
把今天最在意的一件事放在心裡。
</p>

<button
class="primary-btn"
onclick="showMainCards()">
我準備好了
</button>

</div>
    
<div id="drawArea">

<h2>選一張主卡</h2>

<div class="cards">

<div class="card" onclick="pickCard()">✦</div>
<div class="card" onclick="pickCard()">✦</div>
<div class="card" onclick="pickCard()">✦</div>
<div class="card" onclick="pickCard()">✦</div>
<div class="card" onclick="pickCard()">✦</div>

</div>

</div>
<div id="supportArea" style="display:none;">

<h2>選一張副卡</h2>

<p id="selectedMainCardText"
style="
margin-bottom:20px;
font-size:18px;
color:#666;
">
</p>
    
<div class="cards">

<div class="card" onclick="pickSupportCard()">✧</div>
<div class="card" onclick="pickSupportCard()">✧</div>
<div class="card" onclick="pickSupportCard()">✧</div>
<div class="card" onclick="pickSupportCard()">✧</div>
<div class="card" onclick="pickSupportCard()">✧</div>

</div>

</div>
<div id="result"></div>

</div>

<script>

const mainCards = [

{
number:"01",

english:"STILL",

name:"靜止",

image:"清晨的房間、木桌、翻開的空白筆記本、窗邊晨光、大量留白、安靜氛圍",

guidance:"有些答案，只會出現在你終於停下來的時候。",

reading:"你把生活塞得很滿。滿到沒有時間難過，也沒有時間聽見自己。可是有些問題，從來不是靠更多努力解決的。空白不是浪費，而是讓生命有機會回答你。"
},

{
number:"02",

english:"REBIRTH",

name:"重生",

image:"雨後午後、窗台植物、葉片水珠、溫暖陽光、安靜恢復中的生命感",

guidance:"今天不需要堅強。",

reading:"你已經很努力了。努力讓生活恢復正常，努力讓別人放心，也努力告訴自己已經沒事了。可是有些傷口，不是靠堅強癒合的。你可以慢一點，也可以還沒好。"
},

{
number:"03",
 
english:"BOUNDARY",
 
name:"守界",

image:"森林中的石牆小徑、柔和金色光線、界線清晰卻不冰冷、安全與自我保護感",
 
guidance:"別再用委屈自己，交換別人的舒服。",
 
reading:"你總是先想到別人的感受。怕別人失望，怕關係改變，怕自己看起來不夠好。可是每一次忽略自己的感受，都會讓你離自己更遠一點。你的需要，也值得被放在心上。"
},
 
{
number:"04",
 
english:"BELIEVE",
 
name:"相信",

image:"晨霧中的遠方道路、微光逐漸穿透雲層、看不見終點卻願意前行",

guidance:"有些路，走出去之後才會看見方向。",
 
reading:"你其實不是不知道怎麼選。你是在等一個保證。可是生命裡最重要的事情，從來沒有保證。有時候不是看見路才出發，而是出發之後，路才慢慢出現。"
},
 
{
number:"05",
 
english:"FEARLESS",
 
name:"無畏",

image:"風中的山稜與旅人、遠方曙光、迎向未知卻堅定前行",

guidance:"你其實比自己想像的勇敢。",
 
reading:"你總覺得自己做得不夠。卻忘了回頭看看，那些曾經以為撐不過去的日子，其實都已經過去了。害怕並不代表脆弱。願意繼續往前，就是勇氣。"
},
 
{
number:"06",
 
english:"HOPE",
 
name:"希望",

image:"夜色中的燈塔、遠處微光、寬闊天空與海面、等待與可能性",
 
guidance:"你還願意往前看。這本身就是希望。",
 
reading:"有些期待落空了。有些努力沒有結果。有些等待遲遲沒有回應。可是你還在這裡。還願意相信明天。那份不願放棄的心，就是希望存在的地方。"
},
 
{
number:"07",
 
english:"GROUND",
 
name:"安定",

image:"溫暖木屋、壁爐微光、厚實樹根與土地、安穩與回家的感覺",
 
guidance:"安全感，不是世界不變。",
 
reading:"你一直在找一個不會失去的東西。可是沒有什麼真的永遠不變。真正的安定，不是世界永遠照著期待運轉。而是你知道，自己有能力走過改變。"
},
 
{
number:"08",
 
english:"ACCEPT",
 
name:"接納",

image:"平靜湖面映照天空、一朵盛開與凋謝並存的花、溫柔接住自己",
 
guidance:"你不必先變得更好，才值得被溫柔對待。",
 
reading:"你對自己太嚴格了。嚴格到連累了、撐不住了、不想努力了，都覺得是一種失敗。你不是因為足夠好，才值得被愛。是因為你本來就值得。"
},
 
{
number:"09",
 
english:"RESILIENT",
 
name:"柔韌",

image:"隨風彎曲卻不折斷的蘆葦、水面波紋、柔軟中的力量",
 
guidance:"有些力量，來自不再硬撐。",
 
reading:"你已經撐了很久。久到連疲憊都變成習慣。可是柔韌不是一直忍耐。柔韌是在快要斷裂的時候，依然願意彎曲、調整，重新站穩自己。"
},
 
{
number:"10",
 
english:"TRUE SELF",
 
name:"真我",

image:"鏡中的倒影與真實身影重疊、晨光照亮面容、自我看見與覺察",
 
guidance:"你不需要成為別人期待的樣子。",
 
reading:"你花了很多時間理解別人。理解期待、理解規則、理解應該成為什麼樣的人。可是有一天你會發現，最難理解的，其實是自己。今天試著靠近真正的自己一點。"
},
 
{
number:"11",
 
english:"RETURN",
 
name:"歸來",

image:"黃昏小路通往燈火溫暖的家、回家的旅程、內在歸屬感",
 
guidance:"你一直在尋找的，或許從未離開。",
 
reading:"你以為自己迷失了。於是一直向外尋找答案、新的地方、新的人、新的方向。可是有時候，真正想回到的地方，其實一直都在心裡。只是太久沒有回去看看。"
}
    
];

const supportCards = [

{
name:"自己",
guidance:"先把注意力帶回自己。",
reading:"今天可以先聽聽自己真正的感受，而不是急著回應別人的期待。",
combo:{
"留白":"如果暫時不考慮別人的看法，你願意替自己保留多少空間？",
"修復":"修復有時候不是向前，而是重新關心自己的需要。"
}
},

{
name:"時間",
guidance:"有些事情需要時間完成它自己的工作。",
reading:"不是所有改變都需要加快速度，有些事情適合慢慢發生。",
combo:{
"留白":"空白與等待不一定是停滯，也可能是醞釀。",
"修復":"有些修復看起來沒有進展，其實只是正在安靜地發生。"
}
},

{
name:"關係",
guidance:"把這張牌放進一段重要關係裡理解。",
reading:"也許這張牌想讓你重新看見你與某個人之間正在發生什麼。",
combo:{
"留白":"留白不一定是距離，也可能是一種尊重。",
"修復":"有些關係需要時間，也需要空間。"
}
},

{
name:"行動",
guidance:"把理解轉化成一個具體的小步驟。",
reading:"有些清楚會在行動之後出現。",
combo:{
"勇氣":"勇氣不一定是巨大改變，也可能是一個小行動。",
"希望":"希望需要方向，而方向需要一步步實踐。"
}
},

{
name:"資源",
guidance:"看看現在有哪些支持力量。",
reading:"你不一定要獨自完成所有事情。",
combo:{
"修復":"支持有時候比努力更重要。",
"安定":"安全感也可能來自可依靠的人與事。"
}
},

{
name:"改變",
guidance:"新的秩序正在形成。",
reading:"改變不一定劇烈，它也可能很安靜地發生。",
combo:{
"留白":"留白能為改變騰出空間。",
"真實":"真正的改變往往從誠實開始。"
}
},

{
name:"選擇",
guidance:"不是所有選擇都需要立刻決定。",
reading:"有時候看見選項本身，就是一種前進。",
combo:{
"勇氣":"勇敢不一定是衝刺，也可能是做出選擇。",
"真實":"選擇往往反映了你真正重視的事。"
}
},

{
name:"情緒",
guidance:"情緒也是一種訊息。",
reading:"情緒未必需要立刻解決，但值得被理解。",
combo:{
"修復":"理解感受，有時比壓抑感受更能修復自己。",
"安定":"當情緒被看見，安全感才有機會出現。"
}
}
    
];

let selectedMainCard = null;

function startDraw(){

document.getElementById("ritualArea").style.display="block";

document.getElementById("result").innerHTML="";

}

function showMainCards(){

document.getElementById("ritualArea").style.display="none";

document.getElementById("drawArea").style.display="block";

}

function pickCard(){

selectedMainCard =
mainCards[Math.floor(Math.random()*mainCards.length)];

document.getElementById("drawArea").style.display="none";

document.getElementById("supportArea").style.display="block";

document.getElementById("selectedMainCardText").innerHTML =
"主卡已選定：<strong>" +
selectedMainCard.name +
"</strong>";

}
    
function pickSupportCard(){

const supportCard =
supportCards[
Math.floor(Math.random()*supportCards.length)
];

document.getElementById("supportArea").style.display="none";

document.getElementById("result").innerHTML = `

<div class="result">

<div class="card-title">

${selectedMainCard.name}

</div>

<div
style="
height:220px;
background:#EAE3D6;
border-radius:16px;
margin-bottom:20px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
color:#666;
font-size:14px;
">

${selectedMainCard.image}

</div>

<div
style="
background:#183B33;
color:white;
padding:40px 30px;
border-radius:16px;
margin-bottom:25px;
text-align:center;
font-size:22px;
line-height:1.8;
">

${selectedMainCard.guidance}

</div>

<div class="section-title">
解讀
</div>

<div class="guidance">

${selectedMainCard.reading}

</div>

<br>

<div style="text-align:center;">

<button
class="primary-btn"
onclick="restartDraw()"
style="margin-top:30px;">

重新抽牌

</button>

</div>

</div>

`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}
    
function restartDraw(){

document.getElementById("result").innerHTML = "";

document.getElementById("ritualArea").style.display = "none";

document.getElementById("supportArea").style.display = "none";

document.getElementById("drawArea").style.display = "none";

startDraw();

window.scrollTo({
    top:0,
    behavior:"smooth"
});

}

</script>
</body>
</html>
