<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ATELIER STILL</title>

<style>

body{
    margin:0;
    background:#F7F2EA;
    font-family:Microsoft JhengHei,sans-serif;
    text-align:center;
    color:#183B33;
}

.container{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
}

h1{
    font-size:48px;
}

.subtitle{
    margin-bottom:40px;
    color:#666;
}

button{
    cursor:pointer;
}

#drawArea{
    display:none;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    width:120px;
    height:180px;

    background:#183B33;
    color:white;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;

    cursor:pointer;

    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.result{
    margin-top:40px;
    font-size:20px;
}

.guidance{
    margin-top:20px;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="container">

<h1>ATELIER STILL</h1>

<p class="subtitle">
為今天留一點安靜
</p>

<button onclick="startDraw()">
開始抽牌
</button>

<div id="drawArea">

<h2>選一張牌</h2>

<div class="cards">

<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>

</div>

</div>

<div id="result"></div>

</div>

<script>

const cards = [

{
name:"留白",
guidance:"今天不需要填滿每一個空隙。"
},

{
name:"修復",
guidance:"你不需要在還沒準備好的時候，證明自己已經沒事。"
},

{
name:"邊界",
guidance:"溫柔不等於必須答應所有期待。"
},

{
name:"信任",
guidance:"信任不是保證，而是願意面對未知。"
},

{
name:"勇氣",
guidance:"勇氣不是不害怕，而是在害怕時仍願意前進。"
}

];

function startDraw(){

document.getElementById("drawArea").style.display = "block";

}

function pickCard(){

const random =
cards[Math.floor(Math.random()*cards.length)];

document.getElementById("result").innerHTML =

`
<div class="result">

<h2>${random.name}</h2>

<div class="guidance">
${random.guidance}
</div>

</div>
`;

}

</script>

</body>
</html>
