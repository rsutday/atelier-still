<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ATELIER STILL</title>

<style>

body{
    margin:0;
    padding:0;
    background:#F7F2EA;
    color:#183B33;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:40px;
}

button{
    cursor:pointer;
}

.primary-btn{
    padding:14px 28px;
    border:none;
    border-radius:999px;
    background:#183B33;
    color:white;
    font-size:16px;
}

#drawArea{
    display:none;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    width:120px;
    height:180px;

    background:#183B33;
    color:white;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;

    cursor:pointer;

    transition:0.3s;
}

.card:hover{
    transform:translateY(-6px);
}

.result{
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:16px;
    text-align:left;
}

.section-title{
    color:#999;
    font-size:14px;
    margin-top:25px;
}

.card-title{
    text-align:center;
    font-size:30px;
    margin-bottom:20px;
}

.guidance{
    line-height:1.8;
}

.question{
    background:#F5F5F5;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

.practice{
    background:#EEF5EF;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

</style>
</head>
<body>

<div class="container">

<h1>ATELIER STILL</h1>

<p class="subtitle">
為今天留一點安靜
</p>

<button
class="primary-btn"
onclick="startDraw()">
開始抽牌
</button>

<div id="drawArea">

<h2>選一張主卡</h2>

<div class="cards">

<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>
<div class="card" onclick="pickCard()">🂠</div>

</div>

</div>

<div id="result"></div>

</div>

<script>

const mainCards = [

{
name:"留白",
guidance:"今天不需要填滿每一個空隙。",
reading:"有些答案來自努力，有些答案來自空間。這張牌提醒你，不需要把每一刻都安排好。",
question:"最近有什麼事情，比起努力，更需要空間？",
practice:"今天刻意留出十分鐘空白時間，不安排任何事情。"
},

{
name:"修復",
guidance:"你不需要在還沒準備好的時候，證明自己已經沒事。",
reading:"修復不是回到原本的樣子，而是在經歷之後，慢慢找到新的平衡。",
question:"如果不用急著恢復，你最想給自己什麼空間？",
practice:"今天允許自己放慢一件原本急著完成的事。"
},

{
name:"邊界",
guidance:"溫柔不等於必須答應所有期待。",
reading:"界線不是推開別人，而是讓彼此知道如何更舒服地靠近。",
question:"最近有哪件事讓你忽略了自己的界線？",
practice:"練習對一件不想答應的事情多停留三秒再回應。"
},

{
name:"信任",
guidance:"信任不是保證，而是願意面對未知。",
reading:"信任並不代表確定結果，而是在不確定中仍願意往前一步。",
question:"現在的你，最想相信什麼？",
practice:"寫下一件你願意交給時間的事情。"
},

{
name:"勇氣",
guidance:"勇氣不是不害怕，而是在害怕時仍願意前進。",
reading:"很多時候，勇氣不是巨大突破，而是在猶豫中願意踏出一小步。",
question:"如果不讓害怕決定方向，你會想做什麼？",
practice:"完成一個你拖延已久的小步驟。"
}
,

{
name:"希望",
guidance:"希望不是保證，而是一種方向。",
reading:"希望不一定來自確定答案，而是即使還不知道結果，仍願意繼續往前。",
question:"你希望自己不要放棄的是什麼？",
practice:"今天替未來的自己做一件小事。"
},

{
name:"安定",
guidance:"安全感往往從很小的事情開始。",
reading:"安定不是沒有變化，而是在變化之中仍能找到可以依靠的地方。",
question:"最近什麼事情讓你感到安心？",
practice:"做一件能讓自己穩定下來的小習慣。"
}
    
];

const supportCards = [

{
name:"自己",
guidance:"先把注意力帶回自己。",
reading:"今天可以先聽聽自己真正的感受，而不是急著回應別人的期待。",
combo:{
"留白":"如果暫時不考慮別人的看法，你願意替自己保留多少空間？",
"修復":"修復有時候不是向前，而是重新關心自己的需要。"
}
},

{
name:"時間",
guidance:"有些事情需要時間完成它自己的工作。",
reading:"不是所有改變都需要加快速度，有些事情適合慢慢發生。",
combo:{
"留白":"空白與等待不一定是停滯，也可能是醞釀。",
"修復":"有些修復看起來沒有進展，其實只是正在安靜地發生。"
}
},

{
name:"關係",
guidance:"把這張牌放進一段重要關係裡理解。",
reading:"也許這張牌想讓你重新看見你與某個人之間正在發生什麼。",
combo:{
"留白":"留白不一定是距離，也可能是一種尊重。",
"修復":"有些關係需要時間，也需要空間。
}

];

let selectedMainCard = null;

function startDraw(){

document.getElementById("drawArea").style.display="block";

document.getElementById("result").innerHTML="";

}

function pickCard(){

selectedMainCard =
mainCards[Math.floor(Math.random()*mainCards.length)];

document.getElementById("result").innerHTML = `

<div class="result">

<h2>主卡已選定</h2>

<div class="guidance">

<p>
${selectedMainCard.name}
</p>

<p>
請抽取一張副卡
</p>

</div>

<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:30px;">

<button class="primary-btn" onclick="pickSupportCard()">
◇
</button>

<button class="primary-btn" onclick="pickSupportCard()">
◇
</button>

<button class="primary-btn" onclick="pickSupportCard()">
◇
</button>

</div>

</div>

`;

}

function pickSupportCard(){

const supportCard =
supportCards[
Math.floor(Math.random()*supportCards.length)
];

document.getElementById("result").innerHTML = `

<div class="result">

<div class="card-title">

${selectedMainCard.name}
 ×
${supportCard.name}

</div>

<div class="section-title">
核心指引
</div>

<div class="guidance">

<p>
${selectedMainCard.guidance}
</p>

<p>
${supportCard.guidance}
</p>

</div>

<div class="section-title">
主卡解讀
</div>

<div class="guidance">

${selectedMainCard.reading}

</div>

<div class="section-title">
副卡視角
</div>

<div class="guidance">

${supportCard.reading}

</div>

<div class="section-title">
今日組合
</div>

<div class="guidance">

${
supportCard.combo[selectedMainCard.name]
||
"今天可以同時從主卡與副卡的角度思考目前的狀態。"
}

</div>

<div class="section-title">
反思問題
</div>

<div class="question">

${selectedMainCard.question}

</div>

<div class="section-title">
今日支持
</div>

<div class="practice">

${selectedMainCard.practice}

</div>

</div>

`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}
</script>

</body>
</html>
